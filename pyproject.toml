[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-ollama-agenthub"
version = "1.0.0"
description = "Local AI agent framework using Google ADK, LiteLLM, Ollama, and Qwen3."
requires-python = ">=3.13"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
